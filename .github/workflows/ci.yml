name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master

# Public repo security: read-only token permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Security Scan, Quality & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload_user
          POSTGRES_PASSWORD: dev-only-payload-password
          POSTGRES_DB: payload_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3100"
      DATABASE_URI: "postgres://payload_user:dev-only-payload-password@127.0.0.1:5432/payload_db"
      PAYLOAD_SECRET: "ci-dummy-payload-secret-at-least-32-chars-long-random"
      NEXT_PUBLIC_MEDUSA_URL: "http://api.localhost:9000"
      MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
      DATABASE_URL: "postgres://medusa_user:dev-only-medusa-password@127.0.0.1:5432/medusa_db"
      REDIS_URL: "redis://127.0.0.1:6379"
      JWT_SECRET: "ci-dummy-jwt-signing-secret-at-least-32-chars-long-random"
      COOKIE_SECRET: "ci-dummy-cookie-session-secret-at-least-32-chars-random"
      STORE_CORS: "http://localhost:3100"
      ADMIN_CORS: "http://api.localhost:9000"
      AUTH_CORS: "http://api.localhost:9000"
      SETTINGS_ENCRYPTION_KEY: "4e091da86e2b155c5697ee55ab2b5dd54bce76b9df9a9628546b4c3d9e9b827f"
      INTERNAL_API_SECRET: "ci-dummy-internal-api-secret-at-least-32-chars-random"
      API_PUBLIC_URL: "http://api.localhost:9000"
      WEB_PUBLIC_URL: "http://localhost:3100"

    steps:
      # Pinned to commit SHA: actions/checkout@v4.2.2
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # Standalone Gitleaks binary with verified SHA-256 checksum
      # Prevents GitHub organization licensing error on alte-dev org
      - name: Install and Run Gitleaks (Secret Scanner)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_CHECKSUM="cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
          if ! gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz; then
            curl -sSfL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          fi
          echo "${GITLEAKS_CHECKSUM}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
          gitleaks detect --source . --verbose --redact

      # Pinned to commit SHA: pnpm/action-setup@v4.1.0 (commit a7487c7e89a18df4991f7f222e4898a00d66ddda)
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.5.2

      # Pinned to commit SHA: actions/setup-node@v4.2.0
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Code Formatting Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verification Guards (Baseline & Verify Scripts)
        run: |
          pnpm check:baseline
          pnpm check:verify-scripts

      - name: Run Payload Database Migrations on Clean DB
        run: |
          pnpm --filter @alte/web migrate
          pnpm --filter @alte/web migrate:status
          if command -v psql >/dev/null 2>&1; then
            TABLE_COUNT=$(PGPASSWORD=dev-only-payload-password psql -h 127.0.0.1 -U payload_user -d payload_db -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")
            echo "Verified $TABLE_COUNT tables created in public schema."
            if [ "$TABLE_COUNT" -le 0 ]; then
              echo "Error: Expected table count > 0 after migration"
              exit 1
            fi
          fi
          echo "Testing migration idempotency..."
          pnpm --filter @alte/web migrate

      - name: Verify Payload Generated Types & Schema Sync
        run: |
          pnpm --filter @alte/web exec payload generate:types
          git diff --exit-code apps/web/src/payload-types.ts
          pnpm --filter @alte/web exec payload generate:db-schema
          git diff --exit-code apps/web/src/payload-generated-schema.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Security Tests
        run: pnpm test

      - name: Production Build Verification
        run: pnpm build

      - name: Dependency Audit
        run: pnpm audit --prod --audit-level=high

  live-verify:
    name: Live E2E & Stack Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload_user
          POSTGRES_PASSWORD: dev-only-payload-password
          POSTGRES_DB: payload_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SERVER_URL: "http://localhost:3100"
      DATABASE_URI: "postgres://payload_user:dev-only-payload-password@127.0.0.1:5432/payload_db"
      PAYLOAD_SECRET: "ci-dummy-payload-secret-at-least-32-chars-long-random"
      NEXT_PUBLIC_MEDUSA_URL: "http://api.localhost:9000"
      MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
      DATABASE_URL: "postgres://medusa_user:dev-only-medusa-password@127.0.0.1:5432/medusa_db"
      REDIS_URL: "redis://127.0.0.1:6379"
      JWT_SECRET: "ci-dummy-jwt-signing-secret-at-least-32-chars-long-random"
      COOKIE_SECRET: "ci-dummy-cookie-session-secret-at-least-32-chars-random"
      STORE_CORS: "http://localhost:3100,http://127.0.0.1:3100,http://localhost:3101"
      ADMIN_CORS: "http://api.localhost:9000,http://127.0.0.1:9000"
      AUTH_CORS: "http://api.localhost:9000,http://127.0.0.1:9000,http://localhost:3100"
      SETTINGS_ENCRYPTION_KEY: "4e091da86e2b155c5697ee55ab2b5dd54bce76b9df9a9628546b4c3d9e9b827f"
      INTERNAL_API_SECRET: "ci-dummy-internal-api-secret-at-least-32-chars-random"
      REVALIDATION_SECRET: "ci-dummy-revalidation-secret-token-32chars"
      API_PUBLIC_URL: "http://api.localhost:9000"
      WEB_PUBLIC_URL: "http://localhost:3100"
      WEB_URL: "http://localhost:3100"
      STOREFRONT_URL: "http://localhost:3100"
      TEST_WEB_URL: "http://localhost:3100"
      TEST_MEDUSA_URL: "http://127.0.0.1:9000"
      MEDUSA_ADMIN_EMAIL: "admin@example.test"
      MEDUSA_ADMIN_PASSWORD: "supersecret-test-password"
      PAYTR_API_BASE: "http://127.0.0.1:9099"
      DEV_PAYTR_USER_IP: "88.230.10.20"
      ALLOW_DEV_PAYMENT: "true"

    steps:
      # Pinned to commit SHA: actions/checkout@v4.2.2
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Pinned to commit SHA: pnpm/action-setup@v4.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.5.2

      # Pinned to commit SHA: actions/setup-node@v4.2.0
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Initialize PostgreSQL Databases & Extensions
        run: |
          pnpm tsx -e '
            import pg from "pg";
            async function init() {
              const adminPool = new pg.Pool({
                connectionString: "postgres://payload_user:dev-only-payload-password@127.0.0.1:5432/payload_db"
              });
              const roleRes = await adminPool.query("SELECT 1 FROM pg_roles WHERE rolname = '\''medusa_user'\''");
              if (roleRes.rowCount === 0) {
                await adminPool.query("CREATE USER medusa_user WITH PASSWORD '\''dev-only-medusa-password'\'' SUPERUSER");
              }
              const dbRes = await adminPool.query("SELECT 1 FROM pg_database WHERE datname = '\''medusa_db'\''");
              if (dbRes.rowCount === 0) {
                await adminPool.query("CREATE DATABASE medusa_db OWNER medusa_user");
              }
              await adminPool.query("CREATE EXTENSION IF NOT EXISTS unaccent");
              await adminPool.query("CREATE EXTENSION IF NOT EXISTS pg_trgm");
              await adminPool.end();

              const medusaPool = new pg.Pool({
                connectionString: "postgres://medusa_user:dev-only-medusa-password@127.0.0.1:5432/medusa_db"
              });
              await medusaPool.query("CREATE EXTENSION IF NOT EXISTS unaccent");
              await medusaPool.query("CREATE EXTENSION IF NOT EXISTS pg_trgm");
              await medusaPool.end();
              console.log("PostgreSQL databases (payload_db, medusa_db) and extensions initialized.");
            }
            init().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Run Database Migrations (Medusa & Payload)
        run: |
          pnpm --filter @alte/medusa db:migrate
          pnpm --filter @alte/web migrate

      - name: Setup Medusa Store, Admin User, Promotions & Payload Content
        run: |
          pnpm --filter @alte/medusa exec medusa user -e "$MEDUSA_ADMIN_EMAIL" -p "$MEDUSA_ADMIN_PASSWORD"
          pnpm setup:store
          pnpm seed:promotions
          pnpm seed:content
          PUB_KEY=$(pnpm tsx -e '
            import pg from "pg";
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
            pool.query("SELECT token FROM api_key WHERE type = '\''publishable'\'' AND revoked_at IS NULL LIMIT 1")
              .then((r) => { process.stdout.write(r.rows[0]?.token || ""); return pool.end(); })
              .catch((e) => { console.error(e); process.exit(1); });
          ')
          if [ -z "$PUB_KEY" ]; then
            echo "Error: Failed to resolve Medusa publishable key after setup:store"
            exit 1
          fi
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$PUB_KEY" >> "$GITHUB_ENV"
          echo "MEDUSA_PUBLISHABLE_KEY=$PUB_KEY" >> "$GITHUB_ENV"

      - name: Build Production Packages & Apps
        run: pnpm build

      - name: Start Medusa & Web Servers and Seed Catalog
        run: |
          mkdir -p verify-logs
          RUNNER_TRACKING_ID="" nohup env NODE_ENV=development pnpm --filter @alte/medusa start > verify-logs/medusa-server.log 2>&1 </dev/null &
          MEDUSA_PID=$!
          echo "Waiting for Medusa on http://127.0.0.1:9000/health (PID: $MEDUSA_PID)..."
          MEDUSA_READY=0
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:9000/health >/dev/null 2>&1; then
              MEDUSA_READY=1
              break
            fi
            sleep 1
          done
          if [ "$MEDUSA_READY" -ne 1 ]; then
            echo "Medusa failed to start within 60 seconds:"
            cat verify-logs/medusa-server.log
            exit 1
          fi
          echo "Medusa is healthy. Seeding fake catalog..."
          pnpm seed:fake -- --count 40

          RUNNER_TRACKING_ID="" nohup pnpm --filter @alte/web start > verify-logs/web-server.log 2>&1 </dev/null &
          WEB_PID=$!
          echo "Waiting for Web server on http://localhost:3100/ (PID: $WEB_PID)..."
          WEB_READY=0
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:3100/ >/dev/null 2>&1; then
              WEB_READY=1
              break
            fi
            sleep 1
          done
          if [ "$WEB_READY" -ne 1 ]; then
            echo "Web server failed to start within 60 seconds:"
            cat verify-logs/web-server.log
            exit 1
          fi
          echo "Both Medusa and Web servers are up and healthy."

      - name: Run Live Browser Tests (REQUIRE_LIVE_SERVER=true)
        env:
          REQUIRE_LIVE_SERVER: "true"
        run: |
          pnpm --filter @alte/web test src/tests/a11y-axe.test.ts src/tests/keyboard-nav.test.ts src/tests/responsive-pagination.test.ts src/tests/shipping-selection.test.ts

      - name: Run All Live Verification Scripts (pnpm verify:all)
        run: pnpm verify:all

      # Pinned to commit SHA: actions/upload-artifact@v4.6.2
      - name: Upload Verification & Server Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-logs
          path: verify-logs/
          if-no-files-found: warn
